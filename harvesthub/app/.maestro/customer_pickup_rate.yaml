# After the farm handed it over with their code (farmer_hand_over.yaml), the
# customer sees it picked up and gives the farm 4 stars. Pass EMAIL, PASSWORD
# and FARM (the order's farm, newest order first).
appId: com.harvesthubmarket.app
---
- runFlow:
    file: subflows/login.yaml
- tapOn: "Orders"
# Since 2026-11-14 finished orders sit under Completed.
- tapOn: "Completed"
- extendedWaitUntil:
    visible: ${FARM}
    timeout: 30000
# The list says where each order stands (item 17); a finished one is green.
- assertVisible: "Picked up"
- tapOn: ${FARM}
- extendedWaitUntil:
    visible: "Rate this farm"
    timeout: 20000
- assertVisible: "Report a problem.*"
# The stars have names now, and room to tap (item 19).
- tapOn: "4 stars"
- extendedWaitUntil:
    visible: "Add a comment \\(optional\\)"
    timeout: 15000
- tapOn: "Add a comment \\(optional\\)"
- inputText: "Autotest: great peppers"
- hideKeyboard
- tapOn: "Send comment"
# Fix list 24 and 31: a thank-you line, and the comment stays on the order.
- extendedWaitUntil:
    visible: "Thanks, your comment was sent to the farm\\."
    timeout: 15000
- assertVisible: "Your comment"
- assertVisible: "Autotest: great peppers"
- takeScreenshot: customer_pickup_rate_done
