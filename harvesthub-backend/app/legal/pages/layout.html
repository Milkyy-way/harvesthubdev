<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title · HarvestHub</title>
<style>
  :root { --bg: #F6F2E7; --text: #23291F; --muted: #767C6A; --primary: #2F4F3B; --border: #E7E2D3; --tint: #EAF2EC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .brand { font-weight: 700; color: var(--primary); letter-spacing: 0.2px; text-decoration: none; }
  nav { display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0 32px; font-size: 14px; }
  nav a { color: var(--primary); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 34px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 22px; margin: 36px 0 8px; }
  h3 { font-size: 16px; margin: 20px 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .callout { background: var(--tint); border-radius: 16px; padding: 16px 20px; margin: 24px 0; }
  ul, ol { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--primary); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/privacy">HarvestHub</a>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
    <a href="/delete-account">Delete your account</a>
  </nav>
$content
  <footer>$company · Questions? Email <a href="mailto:$support_email">$support_email</a></footer>
</main>
</body>
</html>
